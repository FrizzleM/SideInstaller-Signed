name: deploy-pages

# Builds the install site (sideinstaller.net) from this repository's releases
# and deploys it to GitHub Pages: index.html from the latest stable signed
# release, beta.html from the newest prerelease, each with its OTA manifests,
# plus the static pages and icons from FrizzleM/SideInstaller. See
# scripts/build_site.sh. Nothing is signed and nothing is committed.
#
# sign runs this after every release it publishes. Run it by hand
# (Actions › deploy-pages) to rebuild the page from the releases as they are,
# e.g. after editing terms.html in the main repository.
#
# One-time setup: Settings › Pages › Source = "GitHub Actions", and the custom
# domain (sideinstaller.net) set there. The install links are built from the
# Pages URL GitHub reports, so redeploy once after the domain is changed.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/template.html"
      - "scripts/generate_index.sh"
      - "scripts/build_site.sh"
      - ".github/workflows/deploy-pages.yml"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write      # publish the site
  id-token: write   # required by actions/deploy-pages

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check out the main repository's static files
        uses: actions/checkout@v7
        with:
          repository: FrizzleM/SideInstaller
          path: main-repo
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /terms.html
            /open.html
            /favicon-32.png
            /favicon-192.png
            /app-icon.png
            /SideInstallerDNS.mobileconfig

      - name: Read the Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          STATIC_DIR: main-repo
          SITE_DIR: _site
        run: bash scripts/build_site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
