name: deploy-pages

# Builds the install site (sideinstaller.net) from this repository's releases
# and deploys it to GitHub Pages: index.html from the latest stable release,
# beta.html from the newest prerelease, each with its OTA manifests, plus the
# static pages and icons from FrizzleM/SideInstaller. See signer/site.py.
# Nothing is signed and nothing is committed.
#
# sign runs this whenever it changes a release. Run it by hand (Actions ›
# deploy-pages) to rebuild the page as the releases are, e.g. after editing
# terms.html in the main repository.
#
# One-time setup: Settings › Pages › Source = "GitHub Actions", and the custom
# domain (sideinstaller.net) set there. The install links are built from the
# Pages URL GitHub reports, so redeploy once after the domain is changed.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "signer/site.py"
      - ".github/workflows/deploy-pages.yml"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write      # publish the site
  id-token: write   # required by actions/deploy-pages

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the main repository's static files
        uses: actions/checkout@v7
        with:
          repository: FrizzleM/SideInstaller
          path: main-repo
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /terms.html
            /open.html
            /favicon-32.png
            /favicon-192.png
            /app-icon.png
            /SideInstallerDNS.mobileconfig

      - name: Read the Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_REPO: FrizzleM/SideInstaller
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          STATIC_DIR: main-repo
          PYTHONUNBUFFERED: "1"
        run: python3 -m signer site --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
